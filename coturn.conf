# CoTURN STUN/TURN server configuration for BeamLive NAT Traversal
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

# Fingerprint in TURN messages
fingerprint

# Long-term credential mechanism
lt-cred-mech
use-auth-secret
static-auth-secret=beamlive_turn_secret_key_change_in_prod

realm=beamlive.local
server-name=beamlive-turn

# Log settings
verbose
no-cli
no-tls
no-dtls
